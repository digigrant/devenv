# devenv: the sbx layer. Rebuild with one host command:
#
#   cd ~/devenv && sbx env run
#
# Layout (Docker's environment-file layout: this file sits beside the
# workspace, and the folder that holds it is never mounted):
#
#   ~/devenv/            this repo, on the host only
#   ├── sbxenv.yaml
#   └── dev/             the workspace (gitignored), read-write in the sandbox
#
# Inside the sandbox, devenv itself is a writable clone of the repo at
# ~/fm-projects/devenv, made by the kit when the sandbox is created (the
# `ref` kit argument picks the branch; default main). Test a branch with
# `sbx env run --kit-arg ref=<branch>` when creating the sandbox.
#
# Relative paths resolve from this file's directory. Changes to workspaces,
# kits, secrets and sandboxOptions apply when the sandbox is next created;
# changes to `env` apply on the next `sbx env run`. Passing no path also
# merges ~/.sbxenv.yaml if you have one; use `sbx env run .` to skip it.
schemaVersion: "1"
name: dev

# The devenv kit forks the built-in claude agent (kind: sandbox, extends:
# claude) so the sandbox opens herdr with the first mate. `agent` names the
# kit; `kits` says where it is.
agent: devenv
kits:
  - ./kits/devenv

# The workspace: Firstmate's home and the state that survives a rebuild.
workspace: ./dev

env:
  # What the sandbox opens: herdr (Firstmate) | claude | shell.
  # Edit and re-run `sbx env run`; no recreate needed.
  DEVENV_ENTRY: herdr

# Secret values stay on the host in files only the owner can read (0600).
# Each is one line to swap for a secrets manager later, e.g. `ref: op://…`.
#
# No `anthropic` service secret (V1): sbx would store a `claude setup-token`
# token as an API key (SBX_CRED_ANTHROPIC_MODE=apikey) and Anthropic rejects
# it with 401. Instead `devenv host-prepare` gives the token to the sandbox as
# a custom secret (CLAUDE_CODE_OAUTH_TOKEN, a placeholder the proxy swaps for
# api.anthropic.com), because sbxenv.yaml can't declare custom secrets. See
# CLAUDE_AUTH in devenv.conf; `login` means /login once per rebuild instead.
secrets:
  github:
    command: cat "$HOME/.config/devenv/secrets/github"

# Approves the proxy injecting the github secret (gej-machine) for this
# third-party kit: gh and the REST API, and git over HTTPS. The anthropic
# binding is approved interactively on the first run (the kit inherits that
# credential from claude). Written into ~/.config/sbx/credentials.yaml.
bindings:
  github:
    apiKey:
      domains:
        - api.github.com
        - github.com

sandboxOptions:
  # sbx mounts its shared skills store only for its built-in agents, not for
  # a kit like this one. devenv's skills are linked into ~/.claude/skills from
  # the devenv clone instead (`devenv start`), so the store stays off.
  skills: "off"
  # memory: 12g            # default: 50% of host memory

lifecycle:
  initialize:
    # Runs on the host before every create/run: checks the secret files and
    # the checkout location, creates dev/ and sets up the Claude sign-in.
    - name: devenv host-prepare
      command: ./bin/devenv host-prepare
      workdir: ${{ env.fileDir }}
      timeout: 5m

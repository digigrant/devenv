# devenv settings. Sourced by bash. Non-secret values only: secrets live in
# Infisical, and each host keeps its Infisical login in its keyring
# (docs/SECRETS.md).
#
# Values in single quotes containing $HOME are expanded at runtime, per user.

SANDBOX_NAME=dev
BOT_LOGIN=gej-machine
BOT_EMAIL=318032932+gej-machine@users.noreply.github.com

# Effort. The global default is inherited by Firstmate's workers; the first
# mate itself is launched with `claude --effort "$FIRSTMATE_EFFORT"`.
CLAUDE_EFFORT_DEFAULT=high          # global default, inherited by workers
FIRSTMATE_EFFORT=xhigh              # first mate only, via `claude --effort`
# Claude Code 2.1.x ignores a model-independent effortLevel in user settings
# for current models (V9), so the default is written per model, as
# modelSettings.<model>.effortLevel. Space-separated list. Update this when
# the default model changes; `devenv doctor` flags a mismatch.
CLAUDE_EFFORT_MODELS="claude-opus-5-5"

DEVENV_STATUSLINE_WARNINGS=on       # on|off: the warnings marker in Claude's status line
WARN_DAYS=14                        # expiry warning threshold
ANTHROPIC_TOKEN_EXPIRES=            # YYYY-MM-DD; the setup-token lasts ~1 year; empty = unknown (doctor notes it)

# Infisical (docs/SECRETS.md). The host logs in as the machine identity
# sbx-host; `devenv secret-get NAME` reads one secret for sbx. The project ID,
# client ID and client secret are not settings: `devenv secrets-init` keeps
# them in the host's keyring, and they never go in this repo.
INFISICAL_DOMAIN=https://app.infisical.com   # the Infisical instance
INFISICAL_ENV=dev                             # environment slug
INFISICAL_PATH=/                              # folder
SECRET_GITHUB=GITHUB_GEJ_MACHINE_PAT          # Infisical names
SECRET_CLAUDE=CLAUDE_CODE_OAUTH_TOKEN

# How long sbx keeps a fetched secret in memory before it runs
# `devenv secret-get` again (sbx's --refresh), so how soon a token replaced in
# Infisical reaches the sandbox: a duration such as 55m, 10m or 1h30m, or
# on-demand (fetch on every use: an Infisical login per request). A
# per-secret setting overrides SECRET_REFRESH; empty means SECRET_REFRESH.
# `devenv host-prepare` checks them and applies them on every `sbx env run`.
SECRET_REFRESH=55m                  # every secret from Infisical
SECRET_REFRESH_CLAUDE=              # $SECRET_CLAUDE (the Claude setup-token)
SECRET_REFRESH_GITHUB=              # $SECRET_GITHUB (the gej-machine token)

# How Claude signs in inside the sandbox (V1):
#   token  the long-lived `claude setup-token` token ($SECRET_CLAUDE in
#          Infisical) reaches the sandbox as an sbx custom secret:
#          CLAUDE_CODE_OAUTH_TOKEN holds a placeholder and the proxy swaps in
#          the real token on requests to api.anthropic.com. No /login after
#          a rebuild. The token is inference-only by design, so
#          claude.ai connectors, Remote Control, Claude in Chrome and plugin
#          sync are unavailable. `devenv host-prepare` sets the secret up.
#   login  no Claude secret; run /login once after each rebuild (full scope).
CLAUDE_AUTH=token

# Firstmate comes from the owner's fork, which follows FIRSTMATE_UPSTREAM.
# Fresh setups clone the fork's main; `devenv check` warns when an existing
# clone's origin is not FIRSTMATE_REPO.
FIRSTMATE_REPO=https://github.com/digigrant/firstmate
FIRSTMATE_UPSTREAM=https://github.com/kunchenguid/firstmate
# Automatic updates, whenever `devenv entry` starts a first mate (sandbox
# start or rebuild; never under a running one):
#   1. fast-forward the fork's main from FIRSTMATE_UPSTREAM on GitHub, as
#      gej-machine, only when the fork is strictly behind (a fork with its own
#      commits stops the sync and `devenv check` warns);
#   2. Firstmate's own bin/fm-update.sh fast-forwards $FM_HOME to the fork.
# Upstream changes arrive unreviewed. Set to off to pause both.
FIRSTMATE_AUTO_UPDATE=on

# Firstmate's project clones (FM_PROJECTS_OVERRIDE), on the sandbox's own disk:
# lost on `sbx rm`, so push work. In sbx mode the kit also clones devenv itself
# into <this>/devenv at create; the sandbox runs devenv from that clone.
FM_PROJECTS_DIR='$HOME/fm-projects' # expanded at runtime

# Plain mode only (no sbx): the workspace that holds Firstmate's home and the
# persistent state. FM_HOME becomes $PLAIN_WORKSPACE_DIR/firstmate.
PLAIN_WORKSPACE_DIR='$HOME/dev'

# The Android emulator on the host (opt-in; README "Android emulator").
# `devenv emulator start` runs it headless in a Docker container (Docker
# Engine, with /dev/kvm) and publishes its adb port on the host's 127.0.0.1
# only; `devenv emulator stop` removes it. Sandboxes reach it at
# host.docker.internal:<port> once the host's network policy allows
# localhost:<port>, a rule the owner adds once on the host:
#   sbx policy allow network localhost:15555
ANDROID_EMULATOR_PORT=15555         # host port for adb (5554-5585 stay free for other emulators)
ANDROID_EMULATOR_MEMORY=4096        # guest RAM in MB; 4096 is the least the API 36 image boots with
ANDROID_EMULATOR_CORES=4            # guest CPU cores
